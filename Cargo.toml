[package]
name = "disctui"
version = "0.2.0"
edition = "2024"
authors = ["blacktop"]
description = "Discord TUI with AI summaries and a headless daily digest"
license = "MIT"
repository = "https://github.com/blacktop/disctui"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
color-eyre = "0.6"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = "0.15"
dirs = "6"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-width = "0.2"
libc = "0.2"
rusqlite = { version = "0.39", features = ["bundled"] }
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
textwrap = "0.16"
base64 = "0.22"

# AI summarization
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Optional transport
diself = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
keyring = { version = "3.6", optional = true, features = ["apple-native"] }
zeroize = { version = "1", features = ["derive"], optional = true }
# Browser authorization (PKCE). Already built by rustls.
aws-lc-rs = { version = "1", optional = true, default-features = false, features = ["aws-lc-sys"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", optional = true }
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["NSScreen"] }
tao = { version = "=0.35.3", optional = true }
wry = { version = "=0.57.2", optional = true, default-features = false, features = ["os-webview"] }

[features]
default = []
experimental-discord = [
    "dep:diself",
    "dep:security-framework",
    "dep:tao",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:wry",
    "dep:async-trait",
    "dep:keyring",
    "reqwest/form",
    "dep:zeroize",
    "dep:aws-lc-rs",
]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
diself = { path = "vendor/diself" }
